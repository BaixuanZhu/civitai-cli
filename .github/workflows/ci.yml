# CI: unit tests on every push/PR; the online smoke (live Civitai API) runs
# only on the weekly schedule or manual dispatch -- external network can be
# flaky and Civitai may throttle GitHub runner IPs, so it never sits in the
# release-blocking path (release.yml keeps running unit tests only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch: # manual trigger (also runs the online smoke)

jobs:
  unit-test:
    name: Unit tests (every push/PR)
    runs-on: windows-latest
    env:
      # The runner is an isolated, ephemeral VM, so the gated registry
      # roundtrip test (internal/env) may run here. It is NEVER enabled on a
      # developer machine -- daily `go test` skips it (CIV_TEST_REGISTRY unset).
      CIV_TEST_REGISTRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod pins the exact toolchain (reproducible builds)
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build
        run: go build ./...

  online-smoke:
    name: Online smoke (schedule + manual only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # Never let the test binary write the runner PATH or registry, and never
      # replay cached responses (cache replay would mask upstream API drift).
      CIV_NO_BOOTSTRAP: '1'
      CIV_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod pins the exact toolchain (reproducible builds)
          go-version-file: go.mod
          cache: true
      - name: Build dev binary (bootstrap off)
        run: make build
      - name: Run online smoke against live Civitai
        shell: bash
        run: bash scripts/integration-test.sh